# BROWNFIELD: an enhancement that cuts across schema, entity, repository, service and public API of existing code.
# Demonstrates: static impact analysis over the existing codebase, high-risk classification (schema change +
# modified public API) -> mandatory human design approval, immutable-migration policy, and a realistic defect in
# the first generated change set that the real test suite catches -> rollback -> feedback -> rework -> green.
id: brownfield
kind: brownfield
title: Click limits for short links
requirement: >-
  Links need an optional click limit. When creating a link, clients may set maxClicks (1 to 1,000,000). Once a
  link has been followed maxClicks times, further redirects must return HTTP 410 Gone, and the link metadata must
  expose maxClicks and remainingClicks. Existing links without a limit must behave exactly as before.

approvals:
  design_approval:
    - decision: approve
      approver: architect@shortener-team
      comment: >-
        Nullable column + new V2 migration keeps existing rows valid. Conditional UPDATE for the limit is the right
        call for concurrency. Approved.
  release_approval:
    - decision: approve
      approver: tech-lead@shortener-team
      comment: Off-by-one from round 1 was caught by tests and fixed; boundary test now covers the limit exactly.

recordings:
  requirements:
    - title: Click limits for short links
      intent: Allow single-use or limited-use links that stop redirecting after a configured number of clicks.
      kind: brownfield
      functional_requirements:
        - id: FR-1
          text: POST /api/v1/links accepts an optional maxClicks between 1 and 1,000,000.
          acceptance_criteria:
            - maxClicks=2 is stored and echoed in the 201 response together with remainingClicks=2.
            - maxClicks=0, negative values and values above 1,000,000 are rejected with HTTP 400.
        - id: FR-2
          text: A link with maxClicks=N redirects exactly N times; every later redirect returns HTTP 410 Gone.
          acceptance_criteria:
            - With maxClicks=2 the first two GET /{code} return 302 and the third returns 410.
            - Refused redirects are not counted as clicks.
        - id: FR-3
          text: Link metadata exposes maxClicks and remainingClicks.
          acceptance_criteria:
            - After two clicks on a maxClicks=2 link, GET /api/v1/links/{code} returns clickCount=2 and remainingClicks=0.
        - id: FR-4
          text: Links without maxClicks behave exactly as before (unlimited).
          acceptance_criteria:
            - A link without maxClicks keeps redirecting (302) after many clicks and reports maxClicks=null.
            - Idempotent replays must match maxClicks; a different maxClicks under the same Idempotency-Key returns 409.
      non_functional_requirements:
        - The limit must hold under concurrent redirects (no overshoot).
        - Backward-compatible schema migration; existing rows remain valid.
      domain_terms: [Link, maxClicks, clickCount, redirect, LinkService, LinkRepository, CreateLinkRequest, LinkResponse]
      assumptions:
        - Deactivation and expiry keep their precedence; the click limit is an additional reason for 410.
      out_of_scope:
        - Changing the limit of an existing link (PATCH)
      ambiguities: []
      needs_clarification: false

  planning:
    - rationale: >-
        Schema first (immutable V1, new V2), then the entity, then API/command types that depend on the entity
        accessors, then the service logic that ties them together, then tests. Strictly sequential because each
        layer compiles against the previous one.
      tasks:
        - {id: T1, title: Flyway V2 migration adding nullable max_clicks with check constraint, kind: migration,
           depends_on: [], requirement_ids: [FR-1, FR-4], files: [src/main/resources/db/migration/V2__add_link_max_clicks.sql]}
        - {id: T2, title: Link entity field, constructor and remainingClicks, kind: code, depends_on: [T1],
           requirement_ids: [FR-1, FR-3], files: [src/main/java/io/agentic/shortener/domain/Link.java]}
        - {id: T3, title: Race-free conditional increment in LinkRepository, kind: code, depends_on: [T2],
           requirement_ids: [FR-2], files: [src/main/java/io/agentic/shortener/repository/LinkRepository.java]}
        - {id: T4, title: Request/command/response API fields, kind: code, depends_on: [T2], requirement_ids: [FR-1, FR-3],
           files: [src/main/java/io/agentic/shortener/web/dto/CreateLinkRequest.java,
                   src/main/java/io/agentic/shortener/service/CreateLinkCommand.java,
                   src/main/java/io/agentic/shortener/web/dto/LinkResponse.java,
                   src/main/java/io/agentic/shortener/web/LinkController.java]}
        - {id: T5, title: Enforce limit in LinkService redirect path; idempotency comparison, kind: code, depends_on: [T3, T4],
           requirement_ids: [FR-2, FR-4], files: [src/main/java/io/agentic/shortener/service/LinkService.java]}
        - {id: T6, title: Integration tests for limits, boundaries and backward compatibility, kind: test, depends_on: [T5],
           requirement_ids: [FR-1, FR-2, FR-3, FR-4], files: [src/test/java/io/agentic/shortener/web/MaxClicksIntegrationTest.java]}
        - {id: T7, title: Feature documentation and changelog, kind: docs, depends_on: [T6], requirement_ids: [], files: []}

  design:
    - summary: >-
        Add a nullable max_clicks column (new Flyway V2 migration) and enforce the limit in the redirect path with a
        single conditional UPDATE (increment only while click_count < max_clicks). Unlimited links keep the
        existing code path unchanged. API gains maxClicks (request) and maxClicks/remainingClicks (response).
      decisions:
        - id: D1
          decision: New migration V2 adds nullable max_clicks INTEGER with CHECK (max_clicks > 0)
          rationale: Applied migrations are immutable; NULL means unlimited, so every existing row stays valid (FR-4).
          alternatives: [Edit V1 (breaks Flyway checksums in deployed environments), NOT NULL with sentinel value]
        - id: D2
          decision: Enforce the limit with a conditional UPDATE ... WHERE click_count < max_clicks and check the row count
          rationale: Check and increment are one atomic statement, so concurrent redirects cannot overshoot the limit.
          alternatives: [Read-check-write in Java (races), Optimistic locking with retries (contention on hot links)]
        - id: D3
          decision: Keep the unlimited path byte-for-byte equivalent and isolate the new branch
          rationale: Minimises regression risk for the existing behaviour (FR-4) and keeps analytics failure isolation.
          alternatives: [Single unified path (simpler code, larger behavioural blast radius)]
        - id: D4
          decision: Return 410 Gone (LinkGoneException) when the limit is reached
          rationale: Same semantics clients already handle for expired and deactivated links.
          alternatives: [404 Not Found (hides that the link existed), 429 (wrong semantics)]
      api_changes:
        - "POST /api/v1/links: optional request field maxClicks (1..1,000,000)"
        - "Link responses: new fields maxClicks, remainingClicks (nullable)"
        - "GET /{code}: 410 when the click limit is reached"
      schema_changes: ["links.max_clicks INTEGER NULL, CHECK (max_clicks IS NULL OR max_clicks > 0)"]
      planned_files:
        - src/main/resources/db/migration/V2__add_link_max_clicks.sql
        - src/main/java/io/agentic/shortener/domain/Link.java
        - src/main/java/io/agentic/shortener/repository/LinkRepository.java
        - src/main/java/io/agentic/shortener/web/dto/CreateLinkRequest.java
        - src/main/java/io/agentic/shortener/service/CreateLinkCommand.java
        - src/main/java/io/agentic/shortener/web/dto/LinkResponse.java
        - src/main/java/io/agentic/shortener/web/LinkController.java
        - src/main/java/io/agentic/shortener/service/LinkService.java
        - src/test/java/io/agentic/shortener/web/MaxClicksIntegrationTest.java
      risks:
        - Additive response fields could break clients that use strict deserialisation (unknown properties).
        - The limited path records the click event after the counter update; an analytics failure there leaves the
          counter incremented without an event (counter remains authoritative for the limit).
        - Hot single-use links serialise on one row update; acceptable at prototype scale.

