[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc"
version = "1.0.0"
description = "Governed, LangGraph-based agentic SDLC orchestrator (demonstrated on a URL shortener)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.0,<2",
    "anthropic>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
agentic = "agentic_sdlc.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_sdlc*"]

[tool.setuptools.package-data]
agentic_sdlc = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the real Maven build of the URL shortener (slow, needs JDK + Maven)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
